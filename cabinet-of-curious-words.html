<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Cabinet of Curious Words</title><meta name="description" content="Open six drawers of strange words, unexpected meanings, and language mysteries. A self-paced English 9 discovery game."><style>
:root{color-scheme:dark;--ink:#f1eadb;--muted:#bdb6a9;--gold:#edc578;--green:#a8d4b5;--bg:#121a19;--line:#899b873d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#38534440,transparent 50%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.55}button,input,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:4px}a{color:var(--gold)}header{max-width:1240px;margin:auto;padding:24px 32px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;justify-content:space-between}.brand{font-family:Georgia,serif;font-size:19px;letter-spacing:.03em}.brand span{color:var(--gold);margin-right:10px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.quiet{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:9px 14px;font-size:14px}.quiet:hover{background:#ffffff0b}main{max-width:1180px;margin:auto;padding:36px 28px 60px}.eyebrow{color:var(--gold);text-transform:uppercase;font-size:12px;font-weight:700;letter-spacing:.19em}h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-weight:400;line-height:1.12}h1{font-size:clamp(44px,6vw,76px);margin:17px 0 22px;max-width:720px}h1 em{color:var(--gold);font-weight:400}h2{font-size:clamp(30px,4vw,43px);margin:12px 0 20px}h3{font-size:25px;margin:12px 0}.muted{color:var(--muted)}.lead{font-size:18px;max-width:610px}.hero{display:grid;grid-template-columns:1.2fr .85fr;gap:65px;align-items:center;padding:20px 0 38px}.primary{border:1px solid var(--gold);background:var(--gold);color:#1a241e;border-radius:5px;font-weight:750;padding:13px 23px}.primary:hover{background:#f6d89f}.primary:disabled{opacity:.45}.chips{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.chip{font-size:12px;border:1px solid var(--line);padding:6px 10px;border-radius:30px;color:var(--muted)}.cabinet-art{background:linear-gradient(120deg,#7a513b,#3e2c23);padding:18px;border:2px solid #af8253;border-radius:14px 14px 4px 4px;box-shadow:12px 24px 55px #0007;transform:rotate(2deg);position:relative}.cabinet-art:before{content:'LEXICON · COLLECTION No. 09';display:block;text-align:center;color:#f1d5a2;font-size:11px;letter-spacing:.16em;padding:8px 0 18px}.art-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini-drawer{background:linear-gradient(#70513e,#4c3529);padding:15px 8px 22px;border:1px solid #a57b4c;border-radius:3px;box-shadow:inset 0 2px 5px #0005;text-align:center}.mini-label{display:block;background:#e4d4ad;color:#463726;font:italic 16px Georgia;padding:6px 2px;margin:0 auto 16px;max-width:140px}.handle{display:block;width:45px;height:12px;border:3px solid #c69f62;border-top:0;border-radius:0 0 15px 15px;margin:auto}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:10px 0 34px}.rule{border-top:1px solid var(--line);padding-top:15px;font-size:14px}.rule b{display:block;color:var(--ink);margin-bottom:6px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:12px 0 20px}.drawer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.drawer{position:relative;min-height:206px;text-align:left;padding:23px;background:linear-gradient(125deg,#28352c,#202c26);color:var(--ink);border:1px solid #72816a80;border-radius:5px;box-shadow:0 5px 0 #0a100d}.drawer:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px)}.drawer:disabled{opacity:.47}.drawer small{color:var(--gold);font-size:10px;letter-spacing:.13em}.drawer p{font-size:13px;color:var(--muted);max-width:250px;margin:12px 0}.drawer .handle{position:absolute;right:22px;bottom:20px;width:33px;height:9px;border-width:2px}.status{font-size:12px;color:var(--green)}.progressbar{height:5px;background:#ffffff14;border-radius:8px;overflow:hidden;margin:13px 0 0}.progressbar span{height:100%;display:block;background:var(--gold)}.workspace{max-width:850px;margin:auto}.trail{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:25px;font-size:13px}.card{background:#1d2924;border:1px solid #60735d77;border-radius:9px;padding:clamp(22px,4vw,40px)}.question{font-size:clamp(25px,3vw,34px);line-height:1.25;margin:18px 0 28px}.answers{display:grid;gap:11px}.answer{background:#141e19;border:1px solid #6d806455;border-radius:6px;padding:15px 18px;color:var(--ink);text-align:left;display:flex;align-items:center;gap:14px;line-height:1.4}.letter{border:1px solid #a1af8b66;border-radius:4px;min-width:29px;text-align:center;font-size:12px;padding:3px}.answer:hover:not(:disabled){border-color:var(--gold);background:#2c3928}.answer.correct{border-color:#90cba2;background:#243c2e}.answer.wrong{border-color:#e1a789;background:#422d26}.feedback{background:#11201a;border-left:3px solid var(--gold);padding:20px;margin-top:22px;border-radius:3px}.feedback p{margin:7px 0}.feedback a{font-size:12px}.next-row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px}.note{width:100%;min-height:155px;background:#111d17;color:var(--ink);border:1px solid #83927188;padding:16px;border-radius:6px;resize:vertical;margin-top:15px}.note-label{display:block;font-size:14px;color:var(--muted)}.specimens{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.specimen{border:1px solid #c6a46855;background:#e7ca8610;padding:7px 12px;font-family:Georgia,serif;color:var(--gold)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:26px 0}.stat{background:#18261e;border:1px solid var(--line);padding:18px;text-align:center;border-radius:5px}.stat strong{display:block;font:36px Georgia;color:var(--gold)}.archive-item{border-bottom:1px solid var(--line);padding:18px 0}.archive-item b{color:var(--gold)}.archive-item p{margin:8px 0;font-size:14px}.notice{background:#332d20;color:#efcf91;padding:12px;margin-bottom:16px;border-radius:5px}footer{max-width:1180px;margin:auto;padding:0 28px 30px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:20px}.hidden{display:none!important}.btn-row{display:flex;gap:10px;flex-wrap:wrap}.print-only{display:none}@media(max-width:800px){.hero{grid-template-columns:1fr;gap:25px}.cabinet-art{max-width:420px;width:100%;margin:auto;transform:none}.drawer-grid{grid-template-columns:1fr 1fr}.rules{grid-template-columns:1fr;gap:12px}.hero{padding-top:0}header{padding:17px}.brand{font-size:16px}main{padding:24px 18px}.summary{gap:8px}.stat{padding:12px}.stat strong{font-size:28px}}@media(max-width:480px){.drawer-grid{grid-template-columns:1fr}.top-actions{gap:4px}.quiet{padding:7px 9px}.brand{max-width:150px}.section-head{align-items:start;flex-direction:column}.cabinet-art{max-width:330px}.question{font-size:25px}}@media print{body{background:white;color:#111}header,footer,.no-print,button{display:none!important}main{max-width:none;padding:0}.card,.stat{background:white;color:#111;border:1px solid #aaa}.muted,.eyebrow,.stat strong,.archive-item b{color:#333}.print-only{display:block}textarea{display:none}.archive-item{break-inside:avoid}}
</style></head><body><header><div class="brand"><span>✦</span> The Curious Words Collection</div><nav class="top-actions" aria-label="Game navigation"><button class="quiet" id="home">Cabinet</button><button class="quiet" id="collection">My collection</button><button class="quiet" id="help">How to play</button></nav></header><main id="app" tabindex="-1"></main><footer><span>English 9 · A cabinet for the endlessly curious</span><span>No timer. No sound. Take a closer look.</span></footer><script>
const DATA={"drawers": [{"title": "Is That Even a Word?", "tag": "01 · THE IMPOSTORS", "desc": "One real word hides among three inventions. Trust the evidence, not the silliness.", "note": "Choose one real word from this drawer. Write a sentence that shows its meaning, then explain why someone might mistake it for an invention.", "questions": [{"q": "Which is an established word meaning a fuss or commotion?", "a": "kerfuffle", "other": ["flusterplonk", "squabbleflump", "rucklewhiff"], "why": "Kerfuffle is an informal word for a commotion, often involving disagreement. Silly sounds do not make a word imaginary.", "source": "https://www.merriam-webster.com/dictionary/kerfuffle"}, {"q": "Which is an established word for confusing someone?", "a": "bumfuzzle", "other": ["bamboozlificate", "beflummify", "puzzlemuddle"], "why": "To bumfuzzle someone is to confuse them. A word can be informal and still belong in a dictionary.", "source": "https://www.merriam-webster.com/dictionary/bumfuzzle"}, {"q": "Which is an established word for an umbrella?", "a": "bumbershoot", "other": ["drizzledomelet", "rainfloggle", "puddleparasolium"], "why": "Bumbershoot is a humorous name for an umbrella. It sounds like something a cartoon character might carry.", "source": "https://www.merriam-webster.com/dictionary/bumbershoot"}, {"q": "Which is an established word for nonsense?", "a": "humbug", "other": ["flibberfrazzle", "nonsensicleton", "blatherblooplet"], "why": "Humbug can mean nonsense or a deceptive person or thing. Context tells you which sense is intended.", "source": "https://www.merriam-webster.com/dictionary/humbug"}, {"q": "Which is an established word for a noisy uproar?", "a": "brouhaha", "other": ["roaraflump", "clamoroodle", "shoutlewhack"], "why": "A brouhaha is an uproar or a fuss. It belongs to the same noisy neighborhood as kerfuffle.", "source": "https://www.merriam-webster.com/dictionary/brouhaha"}, {"q": "Which is an established word for fancy or elaborate decoration?", "a": "furbelow", "other": ["frillifloop", "tasselwizzle", "rufflebonkit"], "why": "A furbelow is a ruffle or showy ornament. The plural can refer to unnecessary decorative extras.", "source": "https://www.merriam-webster.com/dictionary/furbelow"}, {"q": "Which is an established word for walking in shallow water?", "a": "wade", "other": ["puddlesprocket", "splashamblet", "wetwomble"], "why": "Wade is familiar, but familiar words are real curiosities too. Not every correct answer has to sound bizarre.", "source": "https://www.merriam-webster.com/dictionary/wade"}, {"q": "Which is an established word meaning to talk at length?", "a": "bloviate", "other": ["talkafrazzle", "speechleflump", "prattlequonk"], "why": "Bloviate means to speak at length, often in a pompous way. The attitude matters as well as the amount of talking.", "source": "https://www.merriam-webster.com/dictionary/bloviate"}, {"q": "Which is an established word meaning to delay or waste time?", "a": "lollygag", "other": ["dawdlebonk", "loiterflib", "stalloodleton"], "why": "Lollygag means to dawdle or spend time aimlessly. It is informal, but it is not an invented answer.", "source": "https://www.merriam-webster.com/dictionary/lollygag"}, {"q": "Which is an established word for a small, insignificant amount?", "a": "smidgen", "other": ["speckleflit", "crumbolino", "tinywhifflet"], "why": "A smidgen is a little bit. English offers many ways to make small things sound even smaller.", "source": "https://www.merriam-webster.com/dictionary/smidgen"}]}, {"title": "That Means WHAT?", "tag": "02 · THE NAME TAGS", "desc": "Ordinary things. Unexpected names. Find the label that fits.", "note": "Pick two discoveries from this drawer. Describe a scene that includes both, using each word so its meaning is clear.", "questions": [{"q": "What is an aglet?", "a": "The covering on the end of a shoelace", "other": ["The hinge on a cabinet door", "The hollow in a spoon", "The space between two teeth"], "why": "An aglet protects a lace end and helps it pass through an eyelet. A tiny object can have a surprisingly specific name.", "source": "https://www.merriam-webster.com/dictionary/aglet"}, {"q": "What is petrichor?", "a": "The earthy smell associated with rain", "other": ["The glitter inside a rock", "A fear of puddles", "The sound of thunder far away"], "why": "Petrichor names the earthy scent associated with rainfall, especially after a dry period.", "source": "https://www.merriam-webster.com/dictionary/petrichor"}, {"q": "What is a tittle in typography?", "a": "A small mark such as the dot over i or j", "other": ["A chapter heading", "The bend in an S", "A missing page number"], "why": "A tittle can be a tiny written mark. Even the little dot over a lowercase i has a name.", "source": "https://www.merriam-webster.com/dictionary/tittle"}, {"q": "What is a philtrum?", "a": "The groove between the nose and upper lip", "other": ["The bend behind the knee", "The white tip of a nail", "A fold at the ear"], "why": "The philtrum is the vertical groove above the upper lip. Specific vocabulary can help describe familiar features precisely.", "source": "https://www.merriam-webster.com/dictionary/philtrum"}, {"q": "What is an octothorpe?", "a": "The # symbol", "other": ["An eight-person bicycle", "A type of seashell", "A musical pause"], "why": "Octothorpe is a name for #. Depending on the situation, people may also call the symbol a number sign, pound sign, or hash.", "source": "https://www.merriam-webster.com/dictionary/octothorpe"}, {"q": "What is a palindrome?", "a": "A sequence that reads the same backward and forward", "other": ["A word with exactly five vowels", "A sentence with no verbs", "A word borrowed from Greek last week"], "why": "Level and radar are palindromes. Longer examples often ignore spaces and punctuation.", "source": "https://www.merriam-webster.com/dictionary/palindrome"}, {"q": "What is a mondegreen?", "a": "A misheard phrase, especially in a song", "other": ["A word meaning two opposite things", "A silent letter", "A sentence with every letter"], "why": "A mondegreen happens when someone hears a phrase as different words. It is a listening mix-up, not necessarily a spelling error.", "source": "https://www.merriam-webster.com/dictionary/mondegreen"}, {"q": "What is a portmanteau word?", "a": "A word formed by blending parts of other words", "other": ["A word that can only be whispered", "A word with no plural", "A name for an ancient alphabet"], "why": "Brunch blends breakfast and lunch. Portmanteau can also name a kind of suitcase: one container holding different things.", "source": "https://www.merriam-webster.com/dictionary/portmanteau"}, {"q": "What is an interrobang?", "a": "A punctuation mark combining a question mark and exclamation point", "other": ["An argument between two dictionaries", "A sentence ending with three periods", "A word pronounced with a gasp"], "why": "The interrobang, ‽, combines questioning and excitement. You may see ?! used for a similar effect.", "source": "https://www.merriam-webster.com/dictionary/interrobang"}, {"q": "What does sesquipedalian describe?", "a": "Long words or a style that uses them", "other": ["A person who walks very slowly", "A poem with six lines", "A sentence without adjectives"], "why": "Sesquipedalian can describe long words or someone who uses them. The word itself makes an excellent example.", "source": "https://www.merriam-webster.com/dictionary/sesquipedalian"}]}, {"title": "Word Detective", "tag": "03 · THE EVIDENCE DESK", "desc": "Read the supplied word-part evidence. Then infer a meaning in context.", "note": "Invent a plausible word using at least two word parts from this drawer. Label it INVENTED, define it, and explain what each part contributes.", "questions": [{"q": "Evidence: bio = life; luminescence = light emission. What is bioluminescence?", "a": "Light produced by a living organism", "other": ["Life surviving without light", "The study of bright rocks", "A lamp that uses batteries"], "why": "Combine the supplied parts: life + giving off light. Fireflies are a familiar example.", "source": "https://www.merriam-webster.com/dictionary/bioluminescence"}, {"q": "Evidence: micro = small; scope = viewing instrument. What does a microscope help you do?", "a": "Observe objects too small to see clearly unaided", "other": ["Hear sounds from far away", "Measure the temperature of a star", "Travel across long distances"], "why": "The parts suggest an instrument for seeing small things. Word parts provide a useful hypothesis.", "source": "https://www.merriam-webster.com/dictionary/microscope"}, {"q": "Evidence: anti- = against. What does an antihero lack?", "a": "Typical heroic qualities", "other": ["Any role in the story", "A name or identity", "The ability to speak"], "why": "An antihero is a central character who lacks conventional heroic traits. Anti- does not automatically mean villain.", "source": "https://www.merriam-webster.com/dictionary/antihero"}, {"q": "Evidence: -less = without. A character is described as guileless. If guile is deceit, what are they like?", "a": "Innocent and without deceit", "other": ["Expert at tricking others", "Unable to make a choice", "Always silent"], "why": "Guile + less means without guile. The suffix reverses the idea of deceit.", "source": "https://www.merriam-webster.com/dictionary/guileless"}, {"q": "Evidence: pre- = before. What is a premonition?", "a": "A feeling that something will happen", "other": ["A memory proven false", "An announcement after an event", "A written apology"], "why": "A premonition is an advance feeling or warning. In a novel, it can help build suspense.", "source": "https://www.merriam-webster.com/dictionary/premonition"}, {"q": "Evidence: bene = well; -volent relates to wishing. A benevolent leader wishes what?", "a": "Good for others", "other": ["To be invisible", "To end all discussion", "To avoid every responsibility"], "why": "Benevolent describes goodwill. A benevolent character wishes others well, though intentions and results may differ.", "source": "https://www.merriam-webster.com/dictionary/benevolent"}, {"q": "Evidence: mal = bad; function = work. A flashlight malfunctions. What happened?", "a": "It failed to work properly", "other": ["It became brighter on purpose", "It was put away safely", "It received a new name"], "why": "Malfunction means to function badly. The word parts fit the everyday meaning directly.", "source": "https://www.merriam-webster.com/dictionary/malfunction"}, {"q": "Evidence: circum- = around; navigate = travel or steer. Circumnavigate means…", "a": "Travel all the way around something", "other": ["Travel beneath the ground", "Measure something without moving", "Stay in the same location"], "why": "Circumnavigate usually means to travel around, especially all the way around the world.", "source": "https://www.merriam-webster.com/dictionary/circumnavigate"}, {"q": "Evidence: chron relates to time. A chronological account organizes events by…", "a": "The order in which they happened", "other": ["How exciting they were", "The length of their names", "The number of characters present"], "why": "Chronological order follows time. Authors can choose a different order through flashbacks.", "source": "https://www.merriam-webster.com/dictionary/chronological"}, {"q": "A student says every word beginning with re must mean again. Which is the strongest response?", "a": "Word parts are clues; check meaning and context too", "other": ["Every opening letter group is a prefix", "Spelling always reveals a complete definition", "The shortest meaning is always correct"], "why": "A recognizable letter sequence is not automatically a meaningful prefix. Word analysis works best alongside context and a reliable dictionary.", "source": "https://www.merriam-webster.com/dictionary/prefix"}]}, {"title": "Borrowed Words", "tag": "04 · THE PASSPORT COLLECTION", "desc": "Languages meet, and words travel. Follow the clues on each passport.", "note": "Choose one borrowed word. Explain why a community might adopt a word from another language, using that word as your example.", "questions": [{"q": "Kindergarten entered English from which language?", "a": "German", "other": ["Japanese", "Arabic", "Portuguese"], "why": "German Kinder means children and Garten means garden. The name imagines a place where children grow.", "source": "https://www.etymonline.com/word/kindergarten"}, {"q": "Which language gave English emoji?", "a": "Japanese", "other": ["Italian", "Latin", "Swedish"], "why": "Japanese e means picture and moji means character. Its resemblance to emotion is a coincidence.", "source": "https://www.etymonline.com/word/emoji"}, {"q": "Robot entered English through a play written in which language?", "a": "Czech", "other": ["Spanish", "Finnish", "Welsh"], "why": "Robot spread through Karel Čapek’s play R.U.R. Its Czech background connects it with forced labor; Josef Čapek suggested the term.", "source": "https://www.etymonline.com/word/robot"}, {"q": "English borrowed ballet from which language?", "a": "French", "other": ["Hindi", "Turkish", "Dutch"], "why": "Ballet came into English from French, with an earlier Italian history. Words can make more than one stop along the way.", "source": "https://www.etymonline.com/word/ballet"}, {"q": "English borrowed tsunami from which language?", "a": "Japanese", "other": ["German", "Greek", "Danish"], "why": "Tsunami comes from Japanese elements meaning harbor and wave. A familiar term can carry a history of place and observation.", "source": "https://www.etymonline.com/word/tsunami"}, {"q": "English borrowed taco from which language?", "a": "Spanish", "other": ["Polish", "Korean", "Norwegian"], "why": "Taco entered English from Mexican Spanish. Mexican describes a national connection; Spanish names the language here.", "source": "https://www.etymonline.com/word/taco"}, {"q": "English borrowed piano, shortened from pianoforte, from which language?", "a": "Italian", "other": ["Czech", "Arabic", "Russian"], "why": "Italian piano and forte mean soft and loud in this musical context. The longer name highlights the instrument’s dynamic range.", "source": "https://www.etymonline.com/word/piano"}, {"q": "English borrowed safari from Swahili. What earlier language is part of its history?", "a": "Arabic", "other": ["Icelandic", "Japanese", "Irish"], "why": "Swahili safari comes from Arabic safar, meaning a journey. Asking for a word’s origin sometimes requires following several links.", "source": "https://www.etymonline.com/word/safari"}, {"q": "What is a loanword?", "a": "A word adopted from another language", "other": ["A word that must be returned after use", "A word only bankers may use", "An invented word with no speakers"], "why": "Borrowing does not require giving a word back. Speakers adopt it, and its sound, spelling, or meaning may change.", "source": "https://www.open.edu/openlearn/mod/oucontent/view.php?id=5907&section=10"}, {"q": "A word reaches English through French but has older Latin roots. Which explanation is best?", "a": "Both languages may be part of its history", "other": ["Only its oldest root counts", "It cannot be an English word", "One source must be lying"], "why": "Word histories can involve several languages. Distinguish the language English borrowed from from earlier ancestors.", "source": "https://www.open.edu/openlearn/mod/oucontent/view.php?id=5907&section=10"}]}, {"title": "Words in Disguise", "tag": "05 · THE DOUBLE LIVES", "desc": "Words blend, imitate, and switch roles. Investigate what they are doing.", "note": "Write two sentences using the same word in different meanings or grammatical roles. Explain how context lets your reader tell the difference.", "questions": [{"q": "Which pair was blended to make brunch?", "a": "Breakfast + lunch", "other": ["Bread + crunch", "Brown + bunch", "Break + munch"], "why": "Brunch combines pieces of breakfast and lunch. It is a blend, not an abbreviation made of initial letters.", "source": "https://www.merriam-webster.com/dictionary/brunch"}, {"q": "Which pair was blended to make smog?", "a": "Smoke + fog", "other": ["Small + bog", "Steam + log", "Smell + cloud"], "why": "Smog blends smoke and fog. Its name packs two environmental conditions into one short word.", "source": "https://www.merriam-webster.com/dictionary/smog"}, {"q": "Which word imitates a sound?", "a": "Buzz", "other": ["Silent", "Purple", "Maybe"], "why": "Buzz is onomatopoeia: a word that imitates a sound. It can also be used figuratively for excitement or attention.", "source": "https://www.merriam-webster.com/dictionary/onomatopoeia"}, {"q": "Which sentence uses text as a verb?", "a": "Please text me the address.", "other": ["The text is difficult.", "I reread the text.", "This text includes a map."], "why": "A word can move into a new grammatical role. In this sentence, text names an action.", "source": "https://www.merriam-webster.com/dictionary/text"}, {"q": "Which word is a compound made from two complete words?", "a": "Moonlight", "other": ["Brunch", "Smog", "Unhappy"], "why": "Moon + light forms a compound. Brunch and smog blend shortened pieces; unhappy uses a prefix.", "source": "https://www.merriam-webster.com/dictionary/moonlight"}, {"q": "In “a bright lamp” and “a bright student,” bright shows…", "a": "Related but different meanings", "other": ["A spelling mistake", "Two unrelated languages", "The same literal description"], "why": "The idea of light extends to intelligence. Context tells you which meaning fits.", "source": "https://www.merriam-webster.com/dictionary/bright"}, {"q": "What makes an acronym different from an ordinary blend?", "a": "It is formed from initial letters and pronounced as a word", "other": ["It must contain exactly four letters", "It is always older than English", "It has no spoken form"], "why": "An acronym such as NASA uses initial letters pronounced together as a word. A blend such as brunch joins pieces of words.", "source": "https://www.merriam-webster.com/dictionary/acronym"}, {"q": "Which pair are homophones in many English accents?", "a": "Flour and flower", "other": ["Rough and through", "Read and red in every tense", "Cat and cut"], "why": "Flour and flower sound alike for many speakers but differ in spelling and meaning. Pronunciation can vary by accent.", "source": "https://www.merriam-webster.com/dictionary/homophone"}, {"q": "What is unusual about cleave?", "a": "It can mean split apart or cling closely", "other": ["It has no vowel", "It can only be a noun", "It is always pronounced silently"], "why": "Cleave has opposite senses with different historical roots. A sentence about cleaving wood differs from one about cleaving to a belief.", "source": "https://www.merriam-webster.com/dictionary/cleave"}, {"q": "“That plan is sick!” Why should a reader check context?", "a": "Sick can express illness or informal approval", "other": ["Sick always expresses approval", "Every slang use is an error", "The speaker must mean a medical diagnosis"], "why": "Speakers can use sick approvingly in slang. Audience and situation matter when deciding what a word means.", "source": "https://www.merriam-webster.com/dictionary/sick"}]}, {"title": "The Curator’s Challenge", "tag": "06 · THE FINAL COLLECTION", "desc": "Use discoveries from across the cabinet. The clues are yours now.", "note": "Choose your favorite discovery from the whole game. Explain what it taught you about how English works, then give a specific example.", "questions": [{"q": "Rain hits the dry courtyard. Which word names the earthy scent?", "a": "Petrichor", "other": ["Philtrum", "Octothorpe", "Mondegreen"], "why": "Petrichor fits the sensory detail. Specific vocabulary can sharpen a description.", "source": "https://www.merriam-webster.com/dictionary/petrichor"}, {"q": "A character creates a huge fuss over a missing pencil. Which word best fits?", "a": "Kerfuffle", "other": ["Aglet", "Palindrome", "Microscope"], "why": "Kerfuffle names the commotion, not the pencil or the person.", "source": "https://www.merriam-webster.com/dictionary/kerfuffle"}, {"q": "Someone hears a song lyric as “secret hamsters” instead of the actual words. This is a…", "a": "Mondegreen", "other": ["Portmanteau", "Prefix", "Palindrome"], "why": "A misheard lyric is a mondegreen. The invented example shows the process without quoting a song.", "source": "https://www.merriam-webster.com/dictionary/mondegreen"}, {"q": "A fictional device reveals tiny living things. Which supplied parts fit its name best?", "a": "Micro- and bio-", "other": ["Anti- and circum-", "Pre- and -less", "Mal- and bene-"], "why": "Micro suggests small and bio suggests life. A coined name can communicate an idea through familiar parts.", "source": ""}, {"q": "A student claims emoji comes from the English word emotion. What evidence challenges that?", "a": "Its Japanese parts mean picture and character", "other": ["All short words come from Latin", "It has too many vowels", "It is never used in English"], "why": "Similar spelling does not prove a shared origin. Emoji has Japanese components.", "source": "https://www.etymonline.com/word/emoji"}, {"q": "Which is strongest evidence that an unfamiliar word is established?", "a": "A reliable dictionary records its meaning and use", "other": ["It sounds old-fashioned", "It contains twelve letters", "A friend says it sounds real"], "why": "Dictionaries document use. Sound and length alone cannot establish whether a word has a history of use.", "source": "https://www.merriam-webster.com/help/faq-words-into-dictionary"}, {"q": "Which word is both a palindrome and an ordinary English word?", "a": "Level", "other": ["Lever", "Lemon", "Later"], "why": "Level reads the same in either direction. Look at the letters rather than the word’s meaning.", "source": "https://www.merriam-webster.com/dictionary/palindrome"}, {"q": "You invent fog + sparkle = farkle for glittery mist. What have you attempted?", "a": "A blend", "other": ["An initialism", "A loan from Japanese", "A guaranteed dictionary entry"], "why": "Combining pieces of words is blending. This example is a playful coinage for the game, not a claim about a dictionary definition.", "source": ""}, {"q": "“The detective found a lead.” What will best identify the intended meaning of lead?", "a": "The surrounding sentences and situation", "other": ["The number of letters alone", "Its position in the alphabet", "The reader’s favorite meaning"], "why": "Lead may name a clue, a metal, or other things. Context helps select the meaning and sometimes the pronunciation.", "source": "https://www.merriam-webster.com/dictionary/lead"}, {"q": "Which conclusion best fits the whole collection?", "a": "English changes through use, contact, and invention", "other": ["English words all came from one language", "Every word has exactly one meaning", "New meanings automatically ruin a language"], "why": "Borrowings, blends, shifting meanings, and new uses all contribute to a living language.", "source": "https://www.open.edu/openlearn/mod/oucontent/view.php?id=5907&section=10"}]}], "bonus": [{"q": "Which sentence uses sanction to mean approve?", "a": "The committee will sanction the event.", "other": ["The nation faced a trade sanction.", "The sanction blocked sales.", "The penalty was a financial sanction."], "why": "Sanction can refer to approval or a penalty. The verb and the surrounding situation help identify the meaning.", "source": "https://www.merriam-webster.com/dictionary/sanction"}, {"q": "Which word becomes another English word when its letters are reversed, but is not itself a palindrome?", "a": "Drawer", "other": ["Level", "Radar", "Civic"], "why": "Drawer reverses to reward. Level, radar, and civic remain the same when reversed.", "source": ""}, {"q": "Evidence: poly = many; glot relates to tongues or languages. A polyglot…", "a": "Uses several languages", "other": ["Writes only in capitals", "Collects punctuation marks", "Dislikes every language"], "why": "The supplied parts lead to many languages. A polyglot is a person who knows or uses several languages.", "source": "https://www.merriam-webster.com/dictionary/polyglot"}, {"q": "Which is an anagram of listen?", "a": "Silent", "other": ["Listing", "Listened", "Listenings"], "why": "An anagram rearranges the same letters. Listen and silent use the same six letters.", "source": "https://www.merriam-webster.com/dictionary/anagram"}, {"q": "Which claim about a newly coined word is strongest?", "a": "It may spread if a community finds it useful", "other": ["It is automatically in every dictionary", "It cannot have a meaning until it is printed", "Only one person may ever use it"], "why": "People can coin words freely, but broader adoption depends on use. A dictionary records established usage rather than granting permission to speak.", "source": "https://www.merriam-webster.com/help/faq-words-into-dictionary"}, {"q": "Which combines both a prefix and a suffix with care?", "a": "Uncareful", "other": ["Caring", "Careless", "Carefree"], "why": "Un-care-ful includes un- before the base and -ful after it. The other choices do not include both a prefix and a suffix.", "source": "https://www.merriam-webster.com/dictionary/uncareful"}, {"q": "Which example shows a word changing grammatical roles?", "a": "They bottled the water.", "other": ["They drank cold water.", "They bought clear glass.", "They found a blue bottle."], "why": "Bottled uses bottle as an action. A familiar noun can also function as a verb.", "source": "https://www.merriam-webster.com/dictionary/bottle"}, {"q": "Which phrase is an oxymoron?", "a": "Deafening silence", "other": ["Quiet room", "Loud concert", "Unexpected visitor"], "why": "An oxymoron places apparently contradictory terms together. Deafening silence suggests an absence of sound that feels overwhelming.", "source": "https://www.merriam-webster.com/dictionary/oxymoron"}, {"q": "What does etymology investigate?", "a": "The history and development of words", "other": ["Only the spelling of new words", "The classification of insects", "Only the correct order of sentences"], "why": "Etymology concerns word histories. Entomology, a similar-looking word, studies insects.", "source": "https://www.merriam-webster.com/dictionary/etymology"}, {"q": "A word has three dictionary definitions. What should you do when reading a novel?", "a": "Choose the sense supported by the context", "other": ["Always use the first definition", "Combine all three in every sentence", "Assume the author made a mistake"], "why": "Dictionary entries collect different senses. The sentence and wider passage determine which sense is useful.", "source": ""}]};
const KEY='curious-words-v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let persistent=true;let state;
const fresh=()=>({v:1,seed:Math.floor(Math.random()*2147483646)+1,answers:{},notes:{},drafts:{},started:false});
try{state=JSON.parse(localStorage.getItem(KEY));if(!state||state.v!==1||!state.answers||!state.notes||!state.drafts)state=fresh()}catch(e){state=fresh();persistent=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){persistent=false}}
let view='home',active=0;
const app=document.getElementById('app');
function focusMain(){app.focus({preventScroll:true});window.scrollTo(0,0)}
const list=d=>d===6?DATA.bonus:DATA.drawers[d].questions;
const count=d=>list(d).filter((q,i)=>state.answers[d+'-'+i]!==undefined).length;
const total=()=>Object.keys(state.answers).filter(k=>!k.startsWith('6-')).length;
const score=()=>Object.entries(state.answers).filter(([k,v])=>{const[d,i]=k.split('-').map(Number);return d<6&&v===list(d)[i].a}).length;
const complete=d=>count(d)===10&&!!state.notes[d];
const finished=()=>DATA.drawers.every((d,i)=>complete(i));
function choices(d,i){let seed=(state.seed+d*1009+i*9176)>>>0;const a=[list(d)[i].a,...list(d)[i].other];for(let j=a.length-1;j>0;j--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const k=Math.floor((seed/4294967296)*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function warning(){return persistent?'':'<div class="notice">This browser cannot save progress. Keep this tab open and export your field notes before leaving.</div>'}
function home(){view='home';const earned=DATA.drawers.filter((d,i)=>complete(i)).length;app.innerHTML=warning()+`<section class="hero"><div><div class="eyebrow">The Museum of Everyday Oddities · Collection 09</div><h1>The Cabinet of<br><em>Curious Words</em></h1><p class="lead muted">Some words sound invented. Some hide secret lives. Open the drawers, follow the clues, and discover just how strange English can be.</p><div class="chips"><span class="chip">60 word mysteries</span><span class="chip">6 short curator notes</span><span class="chip">About 30–40 minutes</span></div><button class="primary" id="begin">${state.started?'Continue exploring →':'Open the first drawer →'}</button><p class="muted" style="font-size:12px">Work quietly on your own. Read each discovery before moving on.</p></div><div class="cabinet-art" aria-hidden="true"><div class="art-grid">${['kerfuffle','petrichor','aglet','mondegreen','bumbershoot','sesquipedalian'].map(w=>`<div class="mini-drawer"><span class="mini-label">${w}</span><span class="handle"></span></div>`).join('')}</div></div></section><div class="rules"><div class="rule"><b>01 · Investigate</b><span class="muted">Choose an answer. A wrong guess still earns you a discovery. Points come from your first answer.</span></div><div class="rule"><b>02 · Collect</b><span class="muted">Read the explanation, then write a short curator note after each drawer to earn its seal.</span></div><div class="rule"><b>03 · Keep exploring</b><span class="muted">Finish all six drawers to open the bonus collection. Progress saves in this browser when available.</span></div></div><section><div class="section-head"><div><div class="eyebrow">Your collection</div><h2 style="margin-bottom:0">Six drawers. Sixty discoveries.</h2></div><span class="muted">${earned}/6 seals · ${total()}/60 mysteries</span></div><div class="drawer-grid">${DATA.drawers.map((d,i)=>`<button class="drawer" data-drawer="${i}" ${i>0&&!complete(i-1)?'disabled':''}><small>${d.tag}</small><h3>${d.title}</h3><p>${d.desc}</p><span class="status">${complete(i)?'✦ Seal collected':i>0&&!complete(i-1)?'Opens after the previous drawer':count(i)>0?count(i)+'/10 investigated':'Ready to investigate'}</span><span class="handle" aria-hidden="true"></span></button>`).join('')}</div></section>${finished()?'<section class="card" style="margin-top:26px"><div class="eyebrow">The hidden shelf is open</div><h2>You are a Curator of Curious Words.</h2><p class="muted">Ten bonus mysteries await, or revisit your discoveries and field notes.</p><div class="btn-row"><button class="primary" id="bonus">Explore the bonus shelf →</button><button class="quiet" id="result">See my collection</button></div></section>':''}`;
document.getElementById('begin').onclick=()=>{state.started=true;save();openDrawer(Math.max(0,DATA.drawers.findIndex((d,i)=>!complete(i))) )};app.querySelectorAll('[data-drawer]').forEach(b=>b.onclick=()=>openDrawer(+b.dataset.drawer));if(finished()){document.getElementById('bonus').onclick=()=>openDrawer(6);document.getElementById('result').onclick=collection}focusMain()}
function openDrawer(d){active=d;state.started=true;save();view='play';renderQuestion();focusMain()}
function renderQuestion(){const d=active,qs=list(d),i=qs.findIndex((q,j)=>state.answers[d+'-'+j]===undefined);if(i<0){if(d===6)return bonusDone();return noteScreen()};const q=qs[i];app.innerHTML=warning()+`<section class="workspace"><div class="trail"><button class="quiet" id="back">← Cabinet</button><span class="muted">${d===6?'Bonus shelf':`Drawer ${d+1} of 6`} · Mystery ${i+1} of 10</span></div><div class="eyebrow">${d===6?'Extraordinary specimens':DATA.drawers[d].tag}</div><h2>${d===6?'The Hidden Shelf':DATA.drawers[d].title}</h2><div class="progressbar" aria-label="${i} of 10 answered"><span style="width:${i*10}%"></span></div><section class="card" style="margin-top:25px"><div class="eyebrow">Specimen ${String(i+1).padStart(2,'0')}</div><h3 class="question">${esc(q.q)}</h3><div class="answers">${choices(d,i).map((a,j)=>`<button class="answer" data-option="${j}"><span class="letter">${'ABCD'[j]}</span><span>${esc(a)}</span></button>`).join('')}</div><div id="reveal" aria-live="polite"></div></section><p class="muted" style="font-size:12px">Follow the clues. Read the discovery. There is no penalty beyond missing that question’s point.</p></section>`;document.getElementById('back').onclick=home;const opts=choices(d,i);app.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>answer(d,i,opts[+b.dataset.option]));}
function answer(d,i,pick){const key=d+'-'+i;if(state.answers[key]!==undefined)return;state.answers[key]=pick;save();const q=list(d)[i],right=pick===q.a,opts=choices(d,i);app.querySelectorAll('[data-option]').forEach(b=>{b.disabled=true;const val=opts[+b.dataset.option];if(val===q.a)b.classList.add('correct');else if(val===pick)b.classList.add('wrong')});document.getElementById('reveal').innerHTML=`<div class="feedback"><strong>${right?'✦ Well spotted. +1 curiosity point':'A new discovery for your collection.'}</strong>${right?'':`<p><b>Answer:</b> ${esc(q.a)}</p>`}<p>${esc(q.why)}</p>${q.source?`<a href="${esc(q.source)}" target="_blank" rel="noopener noreferrer">Reference ↗</a>`:''}</div><div class="next-row"><span class="muted" style="font-size:13px">${i===9&&d!==6?'Next: your curator note':'Add this discovery to your collection.'}</span><button class="primary" id="next">${i===9?(d===6?'Finish bonus shelf':'Write curator note'):'Next mystery'} →</button></div>`;document.getElementById('next').onclick=()=>{renderQuestion();focusMain()};document.getElementById('next').focus({preventScroll:true})}
function noteScreen(){view='note';const d=active,item=DATA.drawers[d],already=!!state.notes[d];app.innerHTML=warning()+`<section class="workspace"><div class="trail"><button class="quiet" id="back">← Cabinet</button><span class="muted">10/10 mysteries investigated</span></div><div class="eyebrow">Drawer ${d+1} · The curator’s notebook</div><h2>Make the discovery yours.</h2><section class="card"><p class="lead" style="margin-top:0">${item.note}</p><label class="note-label" for="fieldnote">Write 1–3 thoughtful sentences. Your note stays in this browser; it is not sent to your teacher.</label><textarea class="note" id="fieldnote" placeholder="Here is what I noticed…">${esc(state.drafts[d]||state.notes[d]||'')}</textarea><div class="next-row"><span class="muted" id="notehint" style="font-size:13px">${already?'Seal already collected. You can revise your note.':'Use a specific discovery in your response.'}</span><button class="primary" id="seal">${already?'Save revised note':'Collect drawer seal'} ✦</button></div></section><details style="margin-top:22px"><summary>Look back at this drawer’s discoveries</summary>${item.questions.map(q=>`<div class="archive-item"><b>${esc(q.a)}</b><p>${esc(q.why)}</p></div>`).join('')}</details></section>`;document.getElementById('back').onclick=home;const field=document.getElementById('fieldnote');field.oninput=()=>{state.drafts[d]=field.value;save();document.getElementById('notehint').textContent='Draft saved in this browser.'};document.getElementById('seal').onclick=()=>{if(field.value.trim().split(/\s+/).filter(Boolean).length<8){document.getElementById('notehint').textContent='Add a little more detail—at least 8 words—before collecting your seal.';field.focus();return}state.notes[d]=field.value.trim();state.drafts[d]=field.value.trim();save();sealScreen(d)};}
function sealScreen(d){view='seal';app.innerHTML=`<section class="workspace card" style="text-align:center;margin-top:30px"><div class="eyebrow">Collection seal ${d+1} of 6</div><div style="font:76px Georgia;color:var(--gold);margin:20px">✦</div><h2>${DATA.drawers[d].title}<br>Collected.</h2><p class="muted">You investigated ten mysteries and added your own curator note.</p><div class="btn-row" style="justify-content:center;margin-top:25px"><button class="primary" id="continue">${d===5?'Reveal my complete collection':'Open the next drawer'} →</button><button class="quiet" id="back">Return to cabinet</button></div></section>`;document.getElementById('continue').onclick=()=>d===5?collection():openDrawer(d+1);document.getElementById('back').onclick=home;focusMain()}
function bonusDone(){view='bonusdone';app.innerHTML=`<section class="workspace card" style="text-align:center"><div class="eyebrow">The hidden shelf</div><h2>Extraordinary collection complete.</h2><p class="muted">Ten more mysteries investigated. Your curiosity has excellent stamina.</p><p class="lead">Bonus score: ${DATA.bonus.filter((q,i)=>state.answers['6-'+i]===q.a).length}/10</p><button class="primary" id="done">View my collection →</button></section>`;document.getElementById('done').onclick=collection;focusMain()}
function exportNotes(){const lines=['THE CABINET OF CURIOUS WORDS','Curator field notes',`Mysteries: ${total()}/60 | First-answer score: ${score()}/60`,''];DATA.drawers.forEach((d,i)=>lines.push(d.title,d.note,state.notes[i]||state.drafts[i]||'(No note yet)',''));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='curious-words-field-notes.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function collection(){view='collection';const seals=DATA.drawers.filter((d,i)=>complete(i)).length;app.innerHTML=warning()+`<section class="workspace"><div class="eyebrow">Your personal collection</div><h2>${finished()?'Curator of Curious Words':'A collection in progress'}</h2><p class="muted">Your first answers earn points. Every explanation earns you a discovery.</p><div class="summary"><div class="stat"><strong>${total()}/60</strong>Mysteries</div><div class="stat"><strong>${score()}</strong>Curiosity points</div><div class="stat"><strong>${seals}/6</strong>Drawer seals</div></div><div class="btn-row no-print"><button class="primary" id="return">${finished()?'Explore bonus shelf':'Continue exploring'} →</button><button class="quiet" id="export">Download my notes</button><button class="quiet" id="print">Print collection</button></div><h3 style="margin-top:35px">The curator’s notebook</h3>${DATA.drawers.map((d,i)=>`<div class="archive-item"><div class="eyebrow">${complete(i)?'✦ Collected':'Still exploring'}</div><h3>${d.title}</h3><p class="muted">${d.note}</p><p style="white-space:pre-wrap">${esc(state.notes[i]||state.drafts[i]||'No curator note yet.')}</p>${count(i)===10?`<button class="quiet no-print" data-edit="${i}">${state.notes[i]?'Revise':'Write'} note</button>`:''}</div>`).join('')}<h3 style="margin-top:35px">Your discoveries</h3><p class="muted no-print">Open a drawer below to revisit answers and explanations.</p>${[...DATA.drawers,{title:'The Hidden Shelf',questions:DATA.bonus}].map((d,di)=>{const answered=d.questions.filter((q,i)=>state.answers[di+'-'+i]!==undefined);return answered.length?`<details style="margin:16px 0"><summary>${d.title} · ${answered.length} discoveries</summary>${d.questions.map((q,i)=>state.answers[di+'-'+i]!==undefined?`<div class="archive-item"><b>${esc(q.q)}</b><p>Your answer: ${esc(state.answers[di+'-'+i])} ${state.answers[di+'-'+i]===q.a?'✓':''}</p><p>Answer: ${esc(q.a)}</p><p class="muted">${esc(q.why)}</p>${q.source?`<a href="${esc(q.source)}" target="_blank" rel="noopener noreferrer">Reference ↗</a>`:''}</div>`:'').join('')}</details>`:''}).join('')}<details class="no-print" style="margin-top:40px"><summary>Start a fresh collection</summary><p class="muted">This clears your answers and notes on this browser. Download your notes first if you want to keep them.</p><button class="quiet" id="reset">Reset this browser’s progress</button></details></section>`;document.getElementById('return').onclick=()=>finished()?openDrawer(6):home();document.getElementById('export').onclick=exportNotes;document.getElementById('print').onclick=()=>window.print();app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{active=+b.dataset.edit;noteScreen();focusMain()});document.getElementById('reset').onclick=()=>{if(confirm('Clear your saved answers and notes? This cannot be undone.')){state=fresh();save();home()}};focusMain()}
function help(){view='help';app.innerHTML=`<section class="workspace card"><div class="eyebrow">A note from the curator</div><h2>Curiosity is the only admission requirement.</h2><p>Explore six drawers in order. Each has ten multiple-choice mysteries and one short curator note. Plan for about 30–40 minutes; your pace may vary.</p><p>Read the explanation after every answer. You earn one point for a correct first answer. Wrong guesses never lock you out. Each finished drawer and curator note earns a seal.</p><p>Curator notes ask you to apply a discovery in 1–3 sentences. They are saved on this device when browser storage is available. They are not automatically sent anywhere. Use <b>My collection → Download my notes</b> if your teacher wants to see them.</p><p>Finish all six drawers to unlock ten bonus questions. There is no timer, sound, leaderboard, or need to rush.</p><p class="muted">Word references are linked after answers. All game questions and explanations are original; the game does not reproduce Bill Bryson’s book. The invented alternatives in Drawer 1 were created for this game.</p><button class="primary" id="back">Back to the cabinet →</button></section>`;document.getElementById('back').onclick=home;focusMain()}
document.getElementById('home').onclick=home;document.getElementById('collection').onclick=collection;document.getElementById('help').onclick=help;home();
</script></body></html>
